[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "AIcap 主管智能体编排层：跨进程编排 Java 平台，结构化地不持有数据库连接"
requires-python = ">=3.11"
# 契约《主管智能体_落地方案_v1.0.md》§5.1 定的是 fastapi/httpx/pydantic/uvicorn；
# python-dotenv 是一处增补（backend/ 已在用，且契约自己就要求 .env.example）。
# test_no_db 会读这份依赖清单，任何数据库驱动出现在这里都会让测试变红。
#
# **上下界都写**（2026-10 增补）：原先只有下界，`fastapi>=0.110` 这种写法意味着
# 下一次 `pip install -e .` 可能装进来一个不相容的大版本 —— 而编排层是**跨进程
# 契约层**，fastapi/pydantic 的大版本漂移会直接炸在响应模型与中间件上。
# 上界一律取**下一个大版本**，取值依据是 venv 里实测可用的版本
# （`pip list`：fastapi 0.143.0 / httpx 0.28.1 / pydantic 2.14.0 /
# uvicorn 0.54.0 / python-dotenv 1.2.4 / pytest 9.1.1 / pytest-asyncio 1.4.0）。
# 刻意**不**写 `==`，也不手写 lock 文件：那是应用的做法，本层是库，
# 锁死等于把兼容负担推给使用者。`tests/test_dependencies.py` 钉住这两条。
dependencies = [
    "fastapi>=0.110,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.23,<2.0",
    # tests/test_dependencies.py 直接 import packaging 核对"声明的区间放不放行
    # 已安装的版本"。它本来就被 pytest 拖着装进来，这里显式声明，免得变成隐式依赖。
    "packaging>=24.0,<27.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
