name: aicap

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # 内存上限依据:生产编排里只有 java 一个应用连本库,Hikari 默认池 10,常态连接数远低于
    # 下面 command 里的 --max-connections=500(那是天花板,不是常态);1G 足以容纳 InnoDB
    # 默认 128MB buffer pool 加上数十条连接的会话缓冲,同时避免 MySQL 按宿主机内存膨胀。
    # cpus 不省核:只是不让 MySQL 在连接尖峰或大量临时表排序时抢走 STT 子进程的 CPU。
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: AIcap
      MYSQL_USER: aicap
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=500
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  java:
    build:
      context: ..
      dockerfile: deploy/java.Dockerfile
    restart: unless-stopped
    # 内存上限依据:java.Dockerfile:16 的 -XX:MaxRAMPercentage=75 是「按 cgroup 上限取 75%
    # 作堆」;没有上限时它改按宿主机内存计算,会与 MySQL/Whisper 互相抢。2G 上限即堆约
    # 1.5G,余下留给 Metaspace/线程栈/直接内存。堆内开销有据:RagProperties.java:43-47 记录
    # mysql 暴力检索单次最多载入 2 万条 1024 维 float32(约 80MB)候选向量,而默认向量库正是
    # mysql(application.yml:57),再叠加 Spring Boot/MyBatis/Hikari(10 连接)基线。
    # cpus 针对同一处:暴力余弦扫描是 CPU 密集突发,限 2 核以免拖住同一宿主上的转写任务。
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/AIcap?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: aicap
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      # 默认不播种:DataSeeder 在表为空时插入 5 个密码为 123456 的演示账号
      # (DataSeeder.java:195/244),全新生产部署不该带弱口令账号。
      # 演示与验收流程需要在 deploy/.env 里显式设 AICAP_SEED_ON_START=true。
      AICAP_SEED_ON_START: ${AICAP_SEED_ON_START:-false}
      AICAP_AUDIO_DIR: /data/audio
      AICAP_LLM_API_KEY: ${AICAP_LLM_API_KEY:?set AICAP_LLM_API_KEY in deploy/.env}
      AICAP_LLM_BASE_URL: ${AICAP_LLM_BASE_URL:-https://api.deepseek.com}
      AICAP_LLM_MODEL: ${AICAP_LLM_MODEL:-deepseek-flash}
      PROFILE_LLM_API_KEY: ${PROFILE_LLM_API_KEY:-}
      PROFILE_LLM_BASE_URL: ${PROFILE_LLM_BASE_URL:-https://api.deepseek.com}
      PROFILE_LLM_MODEL: ${PROFILE_LLM_MODEL:-deepseek-flash}
      AICAP_AGENT_WORKER_ENABLED: ${AICAP_AGENT_WORKER_ENABLED:-true}
    volumes:
      - audio-data:/data/audio
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health | grep -q '\"status\":\"ok\".*\"db\":true'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ai:
    build:
      context: ..
      dockerfile: deploy/ai.Dockerfile
    restart: unless-stopped
    # 内存上限依据:语音链路是「常驻父进程 + 每个任务一个一次性子进程」
    # (transcription_worker.py:1),且 transcription.py:17 的 _SLOT=BoundedSemaphore(1)
    # 由转写与说话人分离共用(diarization.py:58),同一时刻最多一个原生推理子进程。
    # 单个子进程要装下:faster-whisper base 的 int8 权重(compute_type='int8')、sherpa-onnx
    # 的 pyannote-3.0 segmentation + eres2net embedding 两张 onnx(num_threads=2 各一),
    # 以及最长 600 秒 16kHz 音频解码后的 float32 波形约 38MB(transcription_worker.py:41
    # 的 16000*600 上限)。因此 3G 是宁可给宽:上限给紧会让子进程被 OOM 杀掉,表现成
    # stt_failed/diarization_failed,而不是「转写变慢」。模型以只读挂载进容器、不进镜像层,
    # 但推理时权重与 onnxruntime 竞技场仍会占用容器内存,已一并计入上面的估算。
    # cpus 与代码自报的线程预算对齐:whisper cpu_threads=4(说话人分离另用 2+2)。
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "4"
    environment:
      AICAP_LLM_API_KEY: ${AICAP_LLM_API_KEY:?set AICAP_LLM_API_KEY in deploy/.env}
      AICAP_LLM_BASE_URL: ${AICAP_LLM_BASE_URL:-https://api.deepseek.com}
      AICAP_LLM_MODEL: ${AICAP_LLM_MODEL:-deepseek-flash}
      AICAP_STT_MODEL_DIR: /models/stt
      AICAP_DIARIZATION_MODEL_DIR: /models/diarization
    volumes:
      - ../ai-service/.models/faster-whisper-base:/models/stt:ro
      - ../ai-service/.models/diarization:/models/diarization:ro
    depends_on:
      java:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3))['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  orchestrator:
    build:
      context: ..
      dockerfile: deploy/orchestrator.Dockerfile
    restart: unless-stopped
    # 内存上限依据:本服务是**纯编排**,不连库、不加载模型权重 —— 常驻内存只有
    # FastAPI/uvicorn 基线加每轮 run 的事件页(SSE_EVENT_PAGE_LIMIT 默认 100 条),
    # 单条事件是几 KB 量级,一轮撑死百 KB 级。512M 是给它足够的余量又不让它在
    # 同一宿主上和 MySQL(1G)/java(2G)/ai(3G) 抢内存。
    # cpus 给 1:本层不做事密集计算,慢的是等 Java 与等模型,给它更多核不会更快。
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    environment:
      # 唯一上游是 java:编排层自己不持数据库连接,一切数据经它取(契约 §1)。
      JAVA_BASE_URL: http://java:8080
      JAVA_TIMEOUT: ${JAVA_TIMEOUT:-30}
      PORT: 8100
      # 刻意用 `:-`(空而非 `:?`):本层的设计就是"没配模型也起得来,如实报
      # llm_configured=false,并在事件流里给 run.error{not_configured}" ——
      # 用 `:?` 会把它从"诚实地不可用"变成"整个编排起不来",反而丢了一条可观测性。
      AICAP_LLM_API_KEY: ${AICAP_LLM_API_KEY:-}
      AICAP_LLM_BASE_URL: ${AICAP_LLM_BASE_URL:-https://api.deepseek.com}
      AICAP_LLM_MODEL: ${AICAP_LLM_MODEL:-deepseek-flash}
      AICAP_LLM_TIMEOUT: ${AICAP_LLM_TIMEOUT:-60}
      AICAP_CLARIFY_CONFIDENCE: ${AICAP_CLARIFY_CONFIDENCE:-0.6}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15}
      SSE_EVENT_PAGE_LIMIT: ${SSE_EVENT_PAGE_LIMIT:-100}
    depends_on:
      java:
        condition: service_healthy
    healthcheck:
      # /health 不探 Java 存活性(java 不在也回 200,只把 java 字段报 false)——
      # 否则 java 一抖动编排层就被判 unhealthy 并重启,丢掉进程内的 run 登记。
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3))['status']=='ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        # 不设即走前端默认:PROD 下同源相对路径 /orchestrator/(由 nginx 反代)。
        # 只有当编排层被单独部署到别的域名时才需要显式给。
        VITE_ORCH_BASE: ${VITE_ORCH_BASE:-}
    restart: unless-stopped
    ports:
      - "${AICAP_BIND_ADDRESS:-127.0.0.1}:${AICAP_HTTP_PORT:-8088}:80"
    depends_on:
      java:
        condition: service_healthy
      ai:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  mysql-data:
  audio-data:
