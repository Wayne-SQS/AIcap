server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://java:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Profile/commit formal LLM analysis can take longer than 90s;
        # frontend long-request timeout is 300s.
        proxy_read_timeout 310s;
    }

    location /orchestrator/ {
        proxy_pass http://orchestrator:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 的三条必要设置，缺一条「逐条浮现」就会退化成「转圈半天然后一次性全出来」：
        #   buffering off —— nginx 默认把上游响应攒满缓冲区再发，攒着攒着就把事件流
        #       变成了一次性响应；这是本路由唯一**必须**的改动。
        #   cache off —— 顺手关掉，避免任何一层把流式响应当成可缓存体。
        #   X-Accel-Buffering: no —— 告诉更外层可能存在的反代同样别缓冲。
        # 超时与 /meeting-ai/ 对齐：一轮主管对话含模型往返，按长连接给。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        proxy_read_timeout 700s;
        proxy_send_timeout 700s;
    }

    location /meeting-ai/ {
        proxy_pass http://ai:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 700s;
        proxy_send_timeout 700s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
