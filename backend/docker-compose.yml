# 爱管理 · MySQL 8.0(本地开发用)
# 用法:在 backend/ 目录执行  docker compose up -d
# 数据落在 backend/mysql-data/(已 gitignore,不会进仓库)
services:
  mysql:
    image: mysql:8.0
    container_name: aiguanli-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-2026
      MYSQL_DATABASE: AIcap
      MYSQL_USER: aiguanli
      MYSQL_PASSWORD: aiguanli-2026
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"   # 用 3307 避免与系统自装 MySQL 的 3306 冲突
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Qdrant 向量库(RAG 检索层可选实现;默认用 mysql 实现,不需要本服务)
  # 启用:docker compose up -d qdrant,然后设 AICAP_VECTOR_STORE=qdrant
  #
  # 境内网络提示:直连 Docker Hub 拉本镜像实测 8 分钟无进展。若 compose 拉起时卡在
  # "Pulling fs layer",先用镜像源拉下来打回标准 tag,compose 便会直接用本地镜像:
  #   docker pull docker.1ms.run/qdrant/qdrant:latest
  #   docker tag  docker.1ms.run/qdrant/qdrant:latest qdrant/qdrant:latest
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aicap-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant-data:/qdrant/storage
