# 爱管理 · MySQL 8.0(本地开发用)
# 用法:在 backend/ 目录执行  docker compose up -d
# 数据落在 backend/mysql-data/(已 gitignore,不会进仓库)
services:
  mysql:
    image: mysql:8.0
    container_name: aiguanli-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-2026
      MYSQL_DATABASE: AIcap
      MYSQL_USER: aiguanli
      MYSQL_PASSWORD: aiguanli-2026
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"   # 用 3307 避免与系统自装 MySQL 的 3306 冲突
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
