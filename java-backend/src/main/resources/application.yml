server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aicap-java-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/AIcap?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:aiguanli}
    password: ${DB_PASSWORD:aiguanli-2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 建表自举:全部 CREATE TABLE IF NOT EXISTS,幂等;全新空库无需先跑 FastAPI
      mode: always
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
    # 对齐 FastAPI:字段恒输出(含 null),不裁剪
  servlet:
    multipart:
      # 会议录音/上传 mp3:单文件 25MB、整请求 30MB
      max-file-size: ${AICAP_AUDIO_MAX_BYTES:25MB}
      max-request-size: 30MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 与 FastAPI 版相同的 JWT 契约(python-jose HS256,payload: {sub: str(user_id), exp})
aicap:
  jwt:
    # 与 FastAPI .env 的 JWT_SECRET 同一把 key;默认值 ≥32 字节以满足 HS256 最低要求(生产必须用环境变量覆盖)
    secret: ${JWT_SECRET:aicap-dev-secret-change-me-please-use-env-0123456789}
    algorithm: HS256
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
  seed-on-start: ${AICAP_SEED_ON_START:true}
  audio:
    # 会议录音/上传 mp3 的落盘根目录(相对 java-backend 工作目录);元数据入库
    dir: ${AICAP_AUDIO_DIR:./data/audio}
    max-bytes: ${AICAP_AUDIO_MAX_BYTES_BYTES:26214400}
  llm:
    api-key: ${AICAP_LLM_API_KEY:}
    base-url: ${AICAP_LLM_BASE_URL:https://api.deepseek.com}
    model: ${AICAP_LLM_MODEL:deepseek-v4-flash}
    timeout-seconds: 45
    agent-worker-enabled: ${AICAP_AGENT_WORKER_ENABLED:true}
