server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: aicap-java-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/AIcap?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:aiguanli}
    password: ${DB_PASSWORD:aiguanli-2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 建表自举:全部 CREATE TABLE IF NOT EXISTS,幂等;全新空库无需先跑 FastAPI
      mode: always
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
    # 对齐 FastAPI:字段恒输出(含 null),不裁剪
  servlet:
    multipart:
      # 会议录音/上传 mp3:单文件 25MB、整请求 30MB
      max-file-size: ${AICAP_AUDIO_MAX_BYTES:25MB}
      max-request-size: 30MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 与 FastAPI 版相同的 JWT 契约(python-jose HS256,payload: {sub: str(user_id), exp})
aicap:
  jwt:
    # 与 FastAPI .env 的 JWT_SECRET 同一把 key;默认值 ≥32 字节以满足 HS256 最低要求(生产必须用环境变量覆盖)
    secret: ${JWT_SECRET:aicap-dev-secret-change-me-please-use-env-0123456789}
    algorithm: HS256
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
  seed-on-start: ${AICAP_SEED_ON_START:true}
  audio:
    # 会议录音/上传 mp3 的落盘根目录(相对 java-backend 工作目录);元数据入库
    dir: ${AICAP_AUDIO_DIR:./data/audio}
    max-bytes: ${AICAP_AUDIO_MAX_BYTES_BYTES:26214400}
  llm:
    api-key: ${AICAP_LLM_API_KEY:}
    base-url: ${AICAP_LLM_BASE_URL:https://api.deepseek.com}
    model: ${AICAP_LLM_MODEL:deepseek-v4-flash}
    timeout-seconds: 45
    agent-worker-enabled: ${AICAP_AGENT_WORKER_ENABLED:true}
  # RAG 检索层:知识库索引与向量检索(设计文档 A3/A4)
  # 未配置 embedding 密钥时,索引/检索接口返回「未配置」并说明原因,不发任何外部请求
  rag:
    enabled: ${AICAP_RAG_ENABLED:true}
    # mysql = 应用层暴力算余弦(默认,无需额外容器);qdrant = REST 调 ANN 索引
    vector-store: ${AICAP_VECTOR_STORE:mysql}
    # 项目文档源目录(相对 java-backend 工作目录)
    docs-dir: ${AICAP_DOCS_DIR:../docs}
    # 暴力检索单次扫入内存的候选上限(内存上界,不是性能开关)
    mysql-max-scan: ${AICAP_RAG_MYSQL_MAX_SCAN:20000}
    # 各源类型的最低可见角色,默认全部 member(与现有接口的可见性一致)
    # 例:AICAP_RAG_ACL_DOC=admin 把文档源收紧到 admin/owner 可见
    acl: { }
    embedding:
      base-url: ${AICAP_EMBEDDING_BASE_URL:https://api.deepseek.com}
      model: ${AICAP_EMBEDDING_MODEL:}
      api-key: ${AICAP_EMBEDDING_API_KEY:}
      # 维度必须与所选模型一致,否则写入向量库前会直接失败(防止新旧向量混算)
      dimension: ${AICAP_EMBEDDING_DIMENSION:1024}
      batch-size: ${AICAP_EMBEDDING_BATCH:32}
      timeout-seconds: ${AICAP_EMBEDDING_TIMEOUT:45}
      # 单条文本上限;Chunker 按同一上限切分,保证落库内容不被上游截断
      max-chars: ${AICAP_EMBEDDING_MAX_CHARS:2000}
    qdrant:
      base-url: ${AICAP_QDRANT_URL:http://127.0.0.1:6333}
      collection: ${AICAP_QDRANT_COLLECTION:aicap_chunks}

# 画像智能体:独立 LLM 内核(见 ProfileLlmProperties,环境变量前缀 PROFILE_LLM_*)
profile-agent:
  scheduled:
    # 每周自动分析的开关;默认关闭(未配密钥会白跑/产生费用),开启需 PROFILE_LLM_API_KEY
    enabled: ${PROFILE_AGENT_SCHEDULED_ENABLED:false}
    cron: ${PROFILE_AGENT_SCHEDULED_CRON:0 0 9 * * MON}
# US34:GitHub 仓库与成员映射(活动同步源)。未配置时同步接口返回"未配置"状态,不发任何外部请求。
github:
  enabled: ${GITHUB_ENABLED:false}
  # GitHub Personal Access Token(只需 repo 只读权限);建议用环境变量注入,勿提交到仓库
  token: ${GITHUB_TOKEN:}
  # 仓库 owner/repo,如 neusoft/cloud-brain
  repo: ${GITHUB_REPO:}
  api-base: ${GITHUB_API_BASE:https://api.github.com}
  # GitHub 登录名 → 系统 username 的映射(JSON 字符串,环境变量注入)
  # 例: GITHUB_USER_MAPPING='{"li-ming":"李锐铭","zhang-san":"孙秋实"}'
  user-mapping-json: ${GITHUB_USER_MAPPING:}
  # 定时自动同步间隔(小时),0=不自动
  auto-sync-hours: ${GITHUB_AUTO_SYNC_HOURS:0}
  # 单类事件最大拉取页数(每页100条);活跃仓库建议调大
  max-pages: 5
  # 单次同步拉取 Review 的 PR 数上限(每 PR 1 个请求)
  review-pr-limit: 30
