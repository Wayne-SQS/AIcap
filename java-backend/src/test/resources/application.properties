# 测试夹具配置(不是 profile —— 本仓刻意没有 application-test.yml)。
#
# 为什么需要这个文件:application.yml 的 aicap.jwt.secret 已刻意留空
# (生产/开发忘了配就必须起不来,理由见那里的注释)。若不给测试一个密钥,
# 31 个 @SpringBootTest 会在上下文启动时全部失败。
#
# 为什么能只写一个文件:Spring Boot 在同一位置(.properties 与 .yml 同在 classpath 根)
# 时 .properties 优先级更高,所以这里只覆盖这一个键,主配置的其余部分照旧生效;
# 而且它的优先级低于 @SpringBootTest(properties = {...}) 的内联属性,
# 需要覆盖的测试类仍然可以自己说了算。
aicap.jwt.secret=aicap-test-fixture-secret-do-not-use-in-prod-0123456789
